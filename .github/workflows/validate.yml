name: validate-lab

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: labs/lab-01-continuous-risk-identification
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: labs/lab-01-continuous-risk-identification/requirements.txt
      - run: python -m pip install --requirement requirements.txt
      - run: python -m unittest -v
      - run: python evaluation.py
      - run: python build_notebook.py
      - run: python execute_notebook.py
      - name: Reject likely committed API keys
        shell: bash
        working-directory: .
        run: |
          if grep -RIE --exclude-dir=.git --exclude='*.png' 'sk-(proj-)?[A-Za-z0-9_-]{24,}' .; then
            echo 'Potential API key detected.' >&2
            exit 1
          fi
      - name: Build the reproducible lab image
        run: docker build --tag risk-engineer-lab-01:ci .
      - name: Execute the lab inside the image without API credentials
        run: docker run --rm risk-engineer-lab-01:ci python execute_notebook.py
